[package]
name = "teamsync-desktop"
version = "1.0.0"
description = "TeamSync desktop shell — native window around the TeamSync web app"
authors = ["TeamSync"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "teamsync_desktop_lib"
# Desktop-only: rlib avoids MinGW "export ordinal too large" from cdylib.
# (cdylib/staticlib are mainly needed for mobile embedding.)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
